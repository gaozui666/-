<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Web嵌入式浏览器 - 路径即网址</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1e2a36;
            font-family: 'Segoe UI', system-ui, -apple-system, 'Roboto', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        /* 浏览器主窗口 */
        .browser {
            width: 100%;
            max-width: 1500px;
            height: 96vh;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.2s;
        }

        /* 工具栏 */
        .top-bar {
            background: #f8fafc;
            backdrop-filter: blur(8px);
            padding: 10px 20px;
            border-bottom: 1px solid #e2edf2;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            background: #eef2f8;
            padding: 5px 10px;
            border-radius: 40px;
        }

        .btn {
            width: 34px;
            height: 34px;
            background: white;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            border: 1px solid #dce5ec;
            transition: 0.15s;
            color: #2c4b5e;
            box-shadow: 0 1px 1px rgba(0,0,0,0.02);
        }

        .btn:hover {
            background: #e6edf4;
            transform: scale(0.96);
        }

        .btn:active {
            transform: scale(0.93);
        }

        /* 地址栏容器 */
        .address-area {
            flex: 1;
            display: flex;
            align-items: center;
            background: white;
            border-radius: 60px;
            border: 1px solid #cbdde9;
            padding: 4px 16px;
            gap: 8px;
            box-shadow: inset 0 1px 2px #00000008, 0 1px 2px white;
        }

        .url-icon {
            font-size: 18px;
            opacity: 0.7;
        }

        #urlInput {
            flex: 1;
            border: none;
            outline: none;
            font-size: 15px;
            padding: 10px 0;
            background: transparent;
            font-family: 'SF Mono', 'Fira Code', monospace;
            color: #1e3a4d;
        }

        .go-btn {
            background: #1a6d8f;
            border: none;
            color: white;
            border-radius: 40px;
            padding: 6px 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            font-size: 13px;
        }

        .go-btn:hover {
            background: #0e5a78;
            transform: scale(0.96);
        }

        /* iframe 区域 */
        .iframe-container {
            flex: 1;
            background: #eef2f5;
            position: relative;
            overflow: auto;
        }

        #contentFrame {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
            display: block;
        }

        /* 加载遮罩 (可选) */
        .loader-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,240,0.7);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            font-weight: 500;
            color: #226688;
            font-size: 1rem;
            pointer-events: none;
            transition: 0.2s;
        }

        .hidden {
            display: none;
        }

        /* 状态栏小提示 */
        .status-hint {
            background: #eef2fa;
            font-size: 11px;
            padding: 5px 16px;
            border-top: 1px solid #dce5ed;
            color: #3c6578;
            display: flex;
            gap: 20px;
        }

        @media (max-width: 680px) {
            .top-bar {
                padding: 8px 12px;
                gap: 8px;
            }
            .btn {
                width: 28px;
                height: 28px;
                font-size: 14px;
            }
            .go-btn {
                padding: 4px 14px;
            }
            #urlInput {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

<div class="browser">
    <!-- 顶部栏：后退/前进/刷新 + 地址栏 -->
    <div class="top-bar">
        <div class="action-buttons">
            <div class="btn" id="backBtn" title="后退 (历史)">◀</div>
            <div class="btn" id="forwardBtn" title="前进 (历史)">▶</div>
            <div class="btn" id="reloadBtn" title="重新加载">⟳</div>
        </div>

        <div class="address-area">
            <span class="url-icon">🔒</span>
            <input type="text" id="urlInput" placeholder="输入网址，例如 https://example.com 或者 github.com" spellcheck="false">
            <button class="go-btn" id="goBtn">访问</button>
        </div>
    </div>

    <!-- 展示网页内容的容器 -->
    <div class="iframe-container">
        <iframe id="contentFrame" title="嵌入式浏览器视图" sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals allow-top-navigation allow-downloads allow-presentation allow-popups-to-escape-sandbox"></iframe>
        <div id="loaderOverlay" class="loader-overlay hidden">
            <span>🔄 加载中，请稍候...</span>
        </div>
    </div>

    <div class="status-hint">
        <span>✨ 通过URL路径直接加载: 主域名后加斜杠和网址即可自动打开</span>
        <span>⚡ 例如: /https://www.wikipedia.org 或 /http://example.com</span>
    </div>
</div>

<script>
    // ------------------- 核心功能 -------------------
    // 1. 获取当前页面路径中的网址参数 (支持斜杠后直接跟完整网址)
    // 2. 支持手动输入网址并显示在 iframe 内
    // 3. 支持后退/前进 (通过iframe.contentWindow.history? 但跨域限制, 所以改为记录访问栈)
    //    因为iframe内容跨域时无法操作其history, 所以我们维护一个页面访问栈(仅用于同源情况下?? 但为了简单可靠, 做一个简单导航栈.
    //    实际可做URL重定向存储栈, 用户点击的链接是在iframe内部导航时地址栏变化需要监测, 但受同源策略限制无法完美获取iframe内url改变.
    //    但是为了更好的体验, 我们采用监听iframe的load事件, 并尝试更新地址栏显示当前iframe的src (如果跨域无法读取location, 但我们可以记录用户主动加载的网址)
    //    并且后退/前进基于用户主动访问的历史记录（栈方式）.
    // ------------------- 设计思路 -------------------
    // 保留一个 historyStack 存储访问过的URL, currentIndex 记录位置.
    // 后退/前进时改变iframe的src.
    // 同时当用户点击"访问"或从路径解析加载新URL时, 记录到栈中.
    // 并且监听iframe加载完成, 尝试同步地址栏显示 (跨域不能读取实际最终url, 但至少保留用户输入或者主url不变, 但为了精确如果用户点击iframe内跳转不会改变地址栏,
    // 不过用户核心要求: "斜杠后面输入对应网址就能打开，整个域名直接看到这个网站" 以及手动输入网址显示页面内容, 这已足够. 若需要地址栏实时同步内部跳转则需要更多proxy,
    // 本着不跨域限制最好不去侵入, 本工具定义为一个轻量的"内嵌浏览器外壳"，路径驱动为主.
    // 额外升级: 解析 url路径 (当前window.location.pathname + search) 提取目标网址.
    
    // DOM 元素
    const iframe = document.getElementById('contentFrame');
    const urlInput = document.getElementById('urlInput');
    const goBtn = document.getElementById('goBtn');
    const backBtn = document.getElementById('backBtn');
    const forwardBtn = document.getElementById('forwardBtn');
    const reloadBtn = document.getElementById('reloadBtn');
    const loaderOverlay = document.getElementById('loaderOverlay');

    // 浏览历史栈 (仅记录用户通过程序主动加载的URL)
    let historyStack = [];
    let currentIndex = -1;

    // 辅助函数: 标准化URL (自动补充协议)
    function normalizeUrl(raw) {
        let trimmed = raw.trim();
        if (trimmed === "") return null;
        // 如果没有任何协议前缀, 添加 https://
        let hasProtocol = /^[a-zA-Z]+:\/\//.test(trimmed);
        if (!hasProtocol) {
            // 但也要处理类似 "localhost:3000" 情况, 保持灵活
            trimmed = "https://" + trimmed;
        }
        // 简单验证合法性
        try {
            const urlObj = new URL(trimmed);
            return urlObj.href;
        } catch(e) {
            // 无效网址尝试兜底
            return null;
        }
    }

    // 显示加载提示
    function showLoader(show) {
        if (show) {
            loaderOverlay.classList.remove('hidden');
        } else {
            loaderOverlay.classList.add('hidden');
        }
    }

    // 核心: 加载指定的URL到iframe中
    function loadUrlIntoIframe(url, addToHistory = true) {
        if (!url) return false;
        const finalUrl = normalizeUrl(url);
        if (!finalUrl) {
            alert("网址格式无效，请包含完整域名，例如: github.com 或 https://example.com");
            return false;
        }
        
        // 安全策略: 防止XSS, 仅加载合法url
        // 但某些网站禁止被嵌入 (X-Frame-Options) 会拒绝显示, 这属于站点策略, 不归我们管.
        showLoader(true);
        
        // 新加载前, 如果 addToHistory 为true, 更新历史栈
        if (addToHistory) {
            // 如果当前索引不是最后一个，删除之后的记录
            if (currentIndex < historyStack.length - 1) {
                historyStack = historyStack.slice(0, currentIndex + 1);
            }
            historyStack.push(finalUrl);
            currentIndex = historyStack.length - 1;
            // 更新按钮状态稍后
        }
        
        // 设置iframe src
        iframe.src = finalUrl;
        
        // 更新地址栏
        urlInput.value = finalUrl;
        
        // 等待加载完成
        const onLoadHandler = () => {
            showLoader(false);
            iframe.removeEventListener('load', onLoadHandler);
            // 加载完成时，尝试同步地址栏，但由于同源限制无法始终获取iframe最终location，这里保留原始输入。
            // 额外尝试: 如果iframe内容同源则读取并同步url（但是跨域就没办法，不过也不影响体验）
            try {
                const iframeLocation = iframe.contentWindow.location.href;
                if (iframeLocation && iframeLocation !== finalUrl) {
                    // 如果跨域会抛异常, 所以try住即可，能读取就同步一下地址栏
                    if (!iframeLocation.startsWith("about:blank")) {
                        urlInput.value = iframeLocation;
                        // 但是历史栈里原本的记录还是finalUrl, 为了准确也可以将最新的final替换，但无所谓。
                    }
                }
            } catch(e) {
                // 跨域无法读取, 保留原地址显示即可
                // 不做额外处理
            }
            updateNavButtons();
        };
        iframe.addEventListener('load', onLoadHandler, { once: true });
        
        // 超时保险 (某些网站永久加载时, 至少隐藏遮罩)
        setTimeout(() => {
            if (loaderOverlay && !loaderOverlay.classList.contains('hidden')) {
                showLoader(false);
            }
        }, 10000);
        
        updateNavButtons();
        return true;
    }

    // 更新后退前进按钮样式 (根据栈索引判断)
    function updateNavButtons() {
        if (backBtn && forwardBtn) {
            backBtn.style.opacity = currentIndex <= 0 ? "0.4" : "1";
            backBtn.style.cursor = currentIndex <= 0 ? "not-allowed" : "pointer";
            forwardBtn.style.opacity = currentIndex >= historyStack.length - 1 ? "0.4" : "1";
            forwardBtn.style.cursor = currentIndex >= historyStack.length - 1 ? "not-allowed" : "pointer";
        }
    }

    // 后退
    function goBack() {
        if (currentIndex > 0) {
            currentIndex--;
            const prevUrl = historyStack[currentIndex];
            if (prevUrl) {
                showLoader(true);
                iframe.src = prevUrl;
                urlInput.value = prevUrl;
                // 监听加载完成隐藏loader
                const handleLoad = () => {
                    showLoader(false);
                    iframe.removeEventListener('load', handleLoad);
                    updateNavButtons();
                };
                iframe.addEventListener('load', handleLoad, { once: true });
                updateNavButtons();
            }
        }
    }
    
    // 前进
    function goForward() {
        if (currentIndex < historyStack.length - 1) {
            currentIndex++;
            const nextUrl = historyStack[currentIndex];
            if (nextUrl) {
                showLoader(true);
                iframe.src = nextUrl;
                urlInput.value = nextUrl;
                const handleLoad = () => {
                    showLoader(false);
                    iframe.removeEventListener('load', handleLoad);
                    updateNavButtons();
                };
                iframe.addEventListener('load', handleLoad, { once: true });
                updateNavButtons();
            }
        }
    }
    
    // 刷新
    function reloadFrame() {
        if (iframe.src && iframe.src !== "about:blank") {
            showLoader(true);
            // 刷新方法
            iframe.contentWindow.location.reload();
            // 监听刷新完毕
            const onReload = () => {
                showLoader(false);
                iframe.removeEventListener('load', onReload);
            };
            iframe.addEventListener('load', onReload, { once: true });
            // 超时后隐藏
            setTimeout(() => showLoader(false), 5000);
        } else {
            // 没有加载任何页面
            if (historyStack.length > 0 && historyStack[currentIndex]) {
                loadUrlIntoIframe(historyStack[currentIndex], false);
            }
        }
    }
    
    // 从当前页面URL路径中提取目标网址并自动加载
    // 规则: 主域名后面斜杠后所有内容当做网址 (例如: /https://google.com 或者 /http://baidu.com 或者 /en.wikipedia.org)
    function extractUrlFromPath() {
        // 获取当前路径: /xxx/yyy 或者 /https://example.com
        let fullPath = window.location.pathname;
        // 去掉开头的斜杠
        let rawPath = fullPath.startsWith('/') ? fullPath.slice(1) : fullPath;
        if (!rawPath) return null;
        
        // 处理search部分也可考虑，如果有查询参数比如 ?url=xxx 但根据需求“斜杠后面输入对应的网址”优先路径
        // 如果路径为空则忽略
        // 如果原生包含协议直接使用，否则尝试补充协议
        let candidate = decodeURIComponent(rawPath);
        // 如果 candidate 包含点或者类似域名，且没有空白
        if (candidate.length > 0) {
            // 可能不需要协议自动处理补充
            // 如果 candidate 以 // 开头，补充协议头
            if (candidate.startsWith("//")) {
                candidate = "https:" + candidate;
            }
            // 检查常见场景: 类似 "www.example.com/path" 或者 "github.com"
            const hasProtocol = /^[a-zA-Z]+:\/\//.test(candidate);
            if (!hasProtocol && /^([a-zA-Z0-9\-]+\.)+[a-zA-Z]{2,}(:\d+)?(\/|$)/.test(candidate)) {
                candidate = "https://" + candidate;
            }
            try {
                const testUrl = new URL(candidate);
                return testUrl.href;
            } catch(e) {
                // 无效则放弃
                return null;
            }
        }
        return null;
    }
    
    // 初始化: 尝试从路径加载，否则显示欢迎页或默认页
    function initFromPath() {
        const targetFromPath = extractUrlFromPath();
        if (targetFromPath) {
            // 将提取到的网址加入历史并加载
            loadUrlIntoIframe(targetFromPath, true);
        } else {
            // 无有效路径时显示一个友好的起始页 (自制简单引导)
            const startHtml = `
                <!DOCTYPE html>
                <html>
                <head><meta charset="UTF-8"><title>嵌入式浏览器导航</title><style>body{font-family:system-ui;background:#eef2f5;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;} .card{background:white;border-radius:32px;padding:40px;max-width:500px;box-shadow:0 12px 28px rgba(0,0,0,0.1);text-align:center;} h2{color:#1a6d8f;} input{width:80%;padding:12px;margin:16px 0;border-radius:60px;border:1px solid #ccc;}</style></head>
                <body>
                <div class="card">
                <h2>✨ 嵌入式网页浏览器</h2>
                <p>在地址栏输入任何网址，页面将在此显示。或者直接在浏览器URL后添加斜杠和网址：<br/> 
                <code>你的域名/https://wikipedia.org</code></p>
                <p>示例: 访问 <strong>github.com</strong> 或任意站点</p>
                <p style="font-size:13px; color:#6688aa;">注意: 某些网站禁止被嵌入 (X-Frame-Options限制) 属于正常现象</p>
                </div>
                </body>
                </html>
            `;
            const startBlob = "data:text/html;charset=utf-8," + encodeURIComponent(startHtml);
            iframe.src = startBlob;
            urlInput.value = "";
            // 历史栈清空但保留欢迎记录便于体验
            historyStack = [];
            currentIndex = -1;
            updateNavButtons();
            showLoader(false);
        }
    }

    // 手动访问按钮逻辑
    function handleManualGo() {
        let rawInput = urlInput.value.trim();
        if (!rawInput) return;
        const normalized = normalizeUrl(rawInput);
        if (normalized) {
            loadUrlIntoIframe(normalized, true);
            // 同时改变当前窗口url path? 但为了斜杠后解析保持体验, 可以动态替换pushState? 因为用户要求能够“斜杠后面输入对应的网址”就能打开，我们也可以手动更改地址栏而不刷新页面，实现更优雅的URL同步。
            // 但实现单页路由会影响深层刷新，但可以考虑pushState让路径显示当前访问的网址? 这样做更有“整体域名直接看到网站”的效果。
            // 增强: 将当前访问的网址推入浏览器历史记录(地址栏URL) ，使得刷新后也能保留上次的网址路径。 非常好！
            try {
                const currentPathUrl = window.location.origin + "/" + encodeURIComponent(normalized);
                window.history.pushState({}, '', currentPathUrl);
            } catch(e) { /* 忽略 */ }
        } else {
            alert("请输入正确的网址, 例如: github.com 或者 https://example.com");
        }
    }

    // 监听后退/前进按钮，并监听popstate事件(如果用户点击浏览器本身的导航，我们保持同步)
    window.addEventListener('popstate', function(event) {
        // 当用户点击浏览器后退/前进, 重新解析路径加载
        const targetUrl = extractUrlFromPath();
        if (targetUrl) {
            loadUrlIntoIframe(targetUrl, false);
        } else {
            initFromPath();
        }
    });

    // 绑定事件
    goBtn.addEventListener('click', handleManualGo);
    backBtn.addEventListener('click', goBack);
    forwardBtn.addEventListener('click', goForward);
    reloadBtn.addEventListener('click', reloadFrame);
    urlInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            handleManualGo();
        }
    });
    
    // 安全沙箱配置升级: 增加常用许可，确保大多数现代网站能运行js和表单
    iframe.setAttribute('sandbox', 'allow-same-origin allow-scripts allow-popups allow-forms allow-modals allow-top-navigation allow-downloads allow-presentation allow-popups-to-escape-sandbox allow-storage-access-by-user-activation');
    
    // 启动应用：根据路径决定加载页面
    initFromPath();
    
    // 额外处理当iframe加载失败时遮罩隐藏
    iframe.addEventListener('error', () => {
        showLoader(false);
    });
</script>
</body>
</html>
