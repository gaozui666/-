<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>内嵌视图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #ffffff;
        }

        /* iframe 占满全屏，无任何边距、工具栏 */
        .full-frame {
            width: 100%;
            height: 100%;
            display: block;
            border: none;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <!-- 
        直接加载目标网站：gaozui.us.ci
        没有地址栏、没有按钮、没有返回刷新，纯净显示
    -->
    <iframe 
        class="full-frame" 
        src="https://gaozui.us.ci" 
        title="内容显示区域"
        sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals allow-top-navigation allow-downloads allow-presentation"
        loading="eager">
    </iframe>

    <script>
        // 极简后备：如果 iframe 加载失败（例如网络错误或X-Frame限制），不做任何额外UI，
        // 保持空白即可。完全符合无按钮、无控制项的需求。
        // 注：某些网站由于自身设置了 X-Frame-Options 禁止被嵌入，会显示空白，这是网站服务端的策略，
        // 本页面无法绕过，但已完全满足无多余控件的展示要求。
    </script>
</body>
</html>
